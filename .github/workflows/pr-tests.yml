name: PR tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UPLOAD_FOLDER: /tmp/uploads   # used by your code
      PGCONNECT_TIMEOUT: "5"

    steps:
      - name: Check out PR code
        uses: actions/checkout@v4

      - name: Also check out main (for pre-test init step)
        uses: actions/checkout@v4
        with:
          ref: main
          path: mainbranch

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show Python version
        run: python --version
        
      - name: Create .env files (PR and main)
        run: |
          cp .env.example .env
          cp .env.example mainbranch/.env

      - name: Prepare upload dir
        run: mkdir -p "$UPLOAD_FOLDER"

      - name: Verify Docker setup
        run: |
          docker --version
          docker compose version || docker-compose --version
          docker info >/dev/null 2>&1 || (echo "Docker not running" && exit 1)

      - name: Start database (Docker)
        run: docker compose up -d

      - name: Wait for DB
        run: |
          for i in {1..30}; do
            if docker exec artifact_db pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; then
              echo "Postgres is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in time"
          docker compose logs --no-color
          exit 1

      - name: Install dependencies (from PR branch)
        run: pip install -r requirements.txt

      # REQUIRED: run main branch init first, but feed its prompts via stdin
      - name: Run app init from main branch (pre-test)
        working-directory: mainbranch
        run: |
          printf "yes\nyes\n10\n" | python src/main.py

      # Sanity run on PR branch, also feed prompts
      - name: Run project (sanity step on PR branch)
        run: |
          printf "yes\nyes\n10\n" | python src/main.py

      - name: Run tests
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: "1"
          PYTEST_ADDOPTS: "-vv -s --maxfail=1 --durations=20"
        run: |
          pytest tests --ignore=mainbranch --ignore=data/postgres

      # Optional: help debugging if something fails
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Compose down
        if: always()
        run: docker compose down -v
